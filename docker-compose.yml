services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      secrets:
        - openai_api_key
    image: campusx-rag-api:latest
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: campusx-rag-frontend:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Not in .env, and must override any localhost value: inside the compose
      # network the API is reachable as the service name `api`.
      - API_BASE_URL=http://api:8000
      # Chat/session history lives here instead of the container's writable
      # layer, so it survives `docker compose down` + `up` recreation.
      - SESSIONS_FILE_PATH=/app/data/sessions.json
    volumes:
      - frontend_sessions:/app/data
    depends_on:
      - api

# Build-time secret sourced from the OPENAI_API_KEY shell variable. It is mounted
# only into `docker compose build` for the api image and never written into an
# image layer. Export it in the shell before building (see header).
secrets:
  openai_api_key:
    environment: OPENAI_API_KEY

# Named volume for the frontend's chat/session history (sessions.json). The API
# is stateless and saved-embeddings/ is baked into its image at build time, so
# neither service needs a volume.
volumes:
  frontend_sessions: