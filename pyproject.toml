[project]
name = "llmops-rag-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dagshub>=0.7.1",
    "deepeval>=4.0.7",
    "fastapi[standard]>=0.140.5",
    "guardrails-ai>=0.10.2",
    "guardrails-ai-detect-jailbreak>=0.1.6",
    "guardrails-ai-guardrails-pii>=1.0.8",
    "guardrails-ai-prompt-injection-detector>=0.0.2",
    "guardrails-ai-reading-time>=0.1.0",
    "guardrails-ai-relevancy-evaluator>=0.1.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.10",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.2",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.1",
    "langgraph>=1.2.6",
    "mlflow>=3.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "torch>=2.9.0",
    "uvicorn[standard]>=0.49.0",
]

# torch is pulled in transitively by guardrails-ai-detect-jailbreak and only ever
# runs on CPU here. Force the CPU-only build so `uv sync` doesn't download ~5 GB of
# nvidia-*-cu13 CUDA wheels (which also breaks the Docker build).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/app", "src/data", "src/evals", "src/config", "src/frontend", "utils"]
