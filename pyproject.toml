[project]
name = "llmops-rag-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dagshub>=0.7.1",
    "deepeval>=4.0.7",
    "fastapi[standard]>=0.140.5",
    "ipykernel>=7.3.0",
    "langchain>=1.3.10",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.2",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.1",
    "langgraph>=1.2.6",
    "mlflow>=3.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "uvicorn[standard]>=0.49.0",
]

# The guardrails stack is an optional group of pure-LLM validators (the
# guardrails-ai framework plus litellm/langchain-backed hub validators -- no
# torch, no local models). It is installed by a plain `uv sync` locally (see
# default-groups); the Docker API image builds with `--no-default-groups` and
# serves the plain RAG graph.
[dependency-groups]
guardrails = [
    "guardrails-ai>=0.10.2",
    "guardrails-ai-prompt-injection-detector>=0.0.2",
    "guardrails-ai-reading-time>=0.1.0",
    "guardrails-ai-relevancy-evaluator>=0.1.0",
]

[tool.uv]
default-groups = ["guardrails"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/app", "src/data", "src/evals", "src/config", "src/frontend", "utils"]
